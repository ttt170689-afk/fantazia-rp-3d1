name: Android game client APK
on:
  push:
    branches: [arena/95a3da60-fantazia-rp-3d1]
    paths: [apps/android-client/**, apps/ANDROID-APK-RU.txt, .github/workflows/android-client.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-client-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android-client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Policy unit tests, Android lint and TEST APK
        run: bash ci-check.sh gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android connection-screen smoke test
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: apps/android-client
          script: bash ci-check.sh gradle --no-daemon connectedDebugAndroidTest
      - name: Package TEST APK (not a public signed release)
        run: |
          mkdir -p delivery-test
          files=(build/outputs/apk/debug/*.apk)
          test "${#files[@]}" -eq 1
          cp "${files[0]}" delivery-test/Fantazia-RP-TEST-1.0.1-android.apk
          cp ../ANDROID-APK-RU.txt delivery-test/ANDROID-APK-RU.txt
          cd delivery-test
          sha256sum *.apk > SHA256SUMS.txt
      - name: Upload TEST APK and instructions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Fantazia-RP-Android-TEST-APK
          path: apps/android-client/delivery-test/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Check release signing availability
        id: signing
        env:
          STORE: ${{ secrets.FANTAZIA_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.FANTAZIA_ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.FANTAZIA_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$STORE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Only TEST APK built. Production APK requires a permanent private signing key in repository secrets.'
          fi
      - name: Build permanently signed release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.FANTAZIA_ANDROID_KEYSTORE_B64 }}
          FANTAZIA_ANDROID_STORE: ${{ runner.temp }}/fantazia-release.jks
          FANTAZIA_ANDROID_STORE_PASSWORD: ${{ secrets.FANTAZIA_ANDROID_STORE_PASSWORD }}
          FANTAZIA_ANDROID_KEY_PASSWORD: ${{ secrets.FANTAZIA_ANDROID_KEY_PASSWORD }}
          FANTAZIA_ANDROID_KEY_ALIAS: ${{ secrets.FANTAZIA_ANDROID_KEY_ALIAS }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$FANTAZIA_ANDROID_STORE"
          gradle --no-daemon assembleRelease
          mkdir -p delivery-release
          files=(build/outputs/apk/release/*.apk)
          test "${#files[@]}" -eq 1
          cp "${files[0]}" delivery-release/Fantazia-RP-1.0.1-android.apk
          cp ../ANDROID-APK-RU.txt delivery-release/ANDROID-APK-RU.txt
          cd delivery-release
          sha256sum *.apk > SHA256SUMS.txt
      - name: Remove runner signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/fantazia-release.jks"
      - name: Upload signed release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Fantazia-RP-Android-Release-APK
          path: apps/android-client/delivery-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Android-client-test-reports
          path: apps/android-client/build/reports/
          if-no-files-found: ignore
          retention-days: 14
